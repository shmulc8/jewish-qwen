[project]
name = "israeli-qwen"
version = "0.1.0"
description = "Steering Qwen3.5-4B into Kosher-Qwen, Rabbi-Qwen, Hebrew and Bibi"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=2.3.0",
    "torch>=2.15.0",
    "transformers>=5.21.1",
]

[project.scripts]
israeli-qwen = "israeli_qwen:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
